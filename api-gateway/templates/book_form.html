{% extends 'base.html' %}
{% block title %}{% if edit %}Edit Book{% else %}Add Book{% endif %}{% endblock %}
{% block content %}
<div style="padding:32px 0 24px; border-bottom:1px solid var(--border); margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
    <h1 style="margin:0;">{% if edit %}Edit Book{% else %}Add New Book{% endif %}</h1>
    <a href="/books/" class="btn">← Back to Books</a>
</div>

<div style="max-width:640px;">
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div class="form-group" style="grid-column:1/-1;">
                    <label>Title</label>
                    <input type="text" name="title" required value="{% if item %}{{ item.title }}{% endif %}" placeholder="Book title…">
                </div>
                <div class="form-group" style="grid-column:1/-1;">
                    <label>Author</label>
                    <input type="text" name="author" required value="{% if item %}{{ item.author }}{% endif %}" placeholder="Author name…">
                </div>
                <div class="form-group">
                    <label>Price (₫)</label>
                    <input type="number" name="price" step="0.01" required value="{% if item %}{{ item.price }}{% endif %}" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" name="stock" required value="{% if item %}{{ item.stock }}{% endif %}" placeholder="0">
                </div>
                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text" name="isbn" value="{% if item %}{{ item.isbn }}{% endif %}" placeholder="978-…">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category_id">
                        <option value="">— No Category —</option>
                        {% for c in categories %}
                        <option value="{{ c.id }}" {% if item and item.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group" style="grid-column:1/-1;">
                    <label>Description</label>
                    <textarea name="description" rows="3" placeholder="Book synopsis or description…">{% if item %}{{ item.description }}{% endif %}</textarea>
                </div>
            </div>
            <div style="display:flex; gap:10px; margin-top:8px;">
                <button type="submit" class="btn btn-primary">
                    {% if edit %}Update Book{% else %}Create Book{% endif %}
                </button>
                <a href="/books/" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
