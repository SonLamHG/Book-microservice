{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block extra_head %}
<style>
    .auth-wrap {
        min-height: calc(100vh - 78px);
        display: flex; align-items: center; justify-content: center;
        padding: 40px 20px;
    }
    .auth-card {
        width: 100%; max-width: 400px;
        background: #fff; border: 1px solid var(--border);
        border-radius: var(--r-xl); padding: 44px 40px;
        position: relative; overflow: hidden;
        box-shadow: var(--shadow-md);
    }
    .auth-card::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, var(--sage), var(--sage-lt));
        border-radius: 22px 22px 0 0;
    }
    .auth-brand {
        text-align: center; margin-bottom: 36px;
    }
    .auth-brand .logo {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-size: 34px; font-weight: 400; color: var(--tx);
        display: block; margin-bottom: 4px; letter-spacing: -.3px;
    }
    .auth-brand .logo span { color: var(--sage); font-style: normal; }
    .auth-brand .tagline {
        font-size: 11px; color: var(--tx-m); letter-spacing: .2em;
        text-transform: uppercase;
    }
    .auth-title {
        font-family: 'Fraunces', serif;
        font-size: 22px; font-weight: 400; color: var(--tx);
        text-align: center; margin-bottom: 28px;
        letter-spacing: -.2px;
    }
    .auth-footer {
        text-align: center; margin-top: 22px;
        font-size: 13px; color: var(--tx-m);
    }
    .auth-footer a { color: var(--sage); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-submit {
        width: 100%; justify-content: center; padding: 12px;
        font-size: 14px; margin-top: 4px;
    }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="logo">Folio<span>.</span></span>
            <span class="tagline">Bookstore</span>
        </div>
        <div class="auth-title">Welcome back</div>
        {% if error %}
        <div class="alert alert-danger" style="margin-bottom:20px;">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom:24px;">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="/auth/register/">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
