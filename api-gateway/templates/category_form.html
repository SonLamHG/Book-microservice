{% extends 'base.html' %}
{% block title %}{% if edit %}Edit Category{% else %}Add Category{% endif %}{% endblock %}
{% block content %}
<div style="padding:32px 0 24px; border-bottom:1px solid var(--border); margin-bottom:28px; display:flex; justify-content:space-between; align-items:center;">
    <h1 style="margin:0;">{% if edit %}Edit Category{% else %}Add Category{% endif %}</h1>
    <a href="/categories/" class="btn">← Back</a>
</div>
<div style="max-width:480px;">
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required value="{% if item %}{{ item.name }}{% endif %}" placeholder="Category name…">
            </div>
            <div class="form-group" style="margin-bottom:24px;">
                <label>Description</label>
                <textarea name="description" rows="2" placeholder="Short description…">{% if item %}{{ item.description }}{% endif %}</textarea>
            </div>
            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">
                    {% if edit %}Update{% else %}Create Category{% endif %}
                </button>
                <a href="/categories/" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
