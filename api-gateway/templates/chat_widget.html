{% if request.session.user_data %}
<style>
    .chat-toggle {
        position: fixed; bottom: 24px; right: 24px;
        width: 50px; height: 50px;
        background: var(--sage); color: #fff;
        border: none; border-radius: 50%;
        cursor: pointer; font-size: 18px;
        box-shadow: 0 4px 16px var(--sage-glow);
        z-index: 10000; display: flex; align-items: center; justify-content: center;
        transition: background .2s, transform .2s, box-shadow .2s;
    }
    .chat-toggle:hover {
        background: var(--sage-lt);
        transform: scale(1.08);
        box-shadow: 0 6px 24px rgba(92,126,99,.32);
    }
    .chat-badge {
        position: absolute; top: -2px; right: -2px;
        width: 10px; height: 10px;
        background: var(--err); border-radius: 50%;
        display: none; border: 2px solid var(--bg);
    }

    .chat-popup {
        display: none; position: fixed;
        bottom: 88px; right: 24px;
        width: 360px; height: 500px;
        background: #fff; border: 1px solid var(--border);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-lg);
        z-index: 10001; flex-direction: column; overflow: hidden;
    }
    .chat-popup.open { display: flex; }

    .chat-header {
        background: var(--bg-s); padding: 14px 18px;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .chat-header-icon {
        width: 30px; height: 30px; border-radius: 50%;
        background: var(--sage-dim); border: 1px solid rgba(92,126,99,.25);
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; color: var(--sage);
    }
    .chat-header h3 {
        font-family: 'Fraunces', serif;
        font-size: 14px; font-weight: 500; color: var(--tx); margin: 0;
    }
    .chat-header p { font-size: 11px; color: var(--tx-m); margin: 0; }
    .chat-close {
        background: none; border: none; color: var(--tx-m);
        font-size: 18px; cursor: pointer; padding: 4px;
        line-height: 1; border-radius: var(--r-sm); transition: color .15s, background .15s;
    }
    .chat-close:hover { color: var(--tx); background: var(--bg-e); }

    .chat-messages {
        flex: 1; overflow-y: auto; padding: 14px;
        display: flex; flex-direction: column; gap: 10px;
        scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .chat-msg {
        max-width: 82%; padding: 10px 14px;
        border-radius: 12px; font-size: 13.5px; line-height: 1.55;
        word-wrap: break-word;
    }
    .chat-msg.user {
        align-self: flex-end;
        background: var(--sage); color: #fff;
        border-bottom-right-radius: 3px; font-weight: 500;
    }
    .chat-msg.assistant {
        align-self: flex-start;
        background: var(--bg-s); color: var(--tx-s);
        border: 1px solid var(--border);
        border-bottom-left-radius: 3px; max-width: 92%;
    }
    .chat-msg.system {
        align-self: center;
        background: var(--warn-bg); color: var(--warn);
        font-size: 12px; padding: 5px 12px; border-radius: 20px;
    }

    .chat-typing {
        display: none; align-self: flex-start; padding: 10px 14px;
        background: var(--bg-s); border: 1px solid var(--border);
        border-radius: 12px; border-bottom-left-radius: 3px;
    }
    .chat-typing.active { display: flex; gap: 4px; align-items: center; }
    .chat-typing span {
        display: inline-block; width: 6px; height: 6px;
        background: var(--tx-m); border-radius: 50%;
        animation: typing 1.2s infinite;
    }
    .chat-typing span:nth-child(2) { animation-delay: .2s; }
    .chat-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes typing {
        0%,60%,100% { transform: translateY(0); opacity: .4; }
        30% { transform: translateY(-4px); opacity: 1; }
    }

    .chat-input-area {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        display: flex; gap: 8px; background: var(--bg-s); flex-shrink: 0;
    }
    .chat-input {
        flex: 1; padding: 9px 13px;
        background: #fff; border: 1px solid var(--border);
        border-radius: 20px; color: var(--tx);
        font-size: 13.5px; font-family: 'Jost', sans-serif;
        outline: none; resize: none; max-height: 80px; line-height: 1.5;
        transition: border-color .15s;
    }
    .chat-input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-dim); }
    .chat-input::placeholder { color: var(--tx-f); }
    .chat-send {
        background: var(--sage); color: #fff;
        border: none; border-radius: 50%;
        width: 36px; height: 36px; flex-shrink: 0;
        cursor: pointer; font-size: 14px;
        display: flex; align-items: center; justify-content: center;
        transition: background .15s; align-self: flex-end;
    }
    .chat-send:hover { background: var(--sage-lt); }
    .chat-send:disabled { background: var(--bg-e); color: var(--tx-m); cursor: not-allowed; }
</style>

<button class="chat-toggle" id="chatToggle" title="Book Advisor Chat">
    ✦
    <span class="chat-badge" id="chatBadge"></span>
</button>

<div class="chat-popup" id="chatPopup">
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="chat-header-icon">✦</div>
            <div>
                <h3>Folio Assistant</h3>
                <p>AI Book Advisor</p>
            </div>
        </div>
        <button class="chat-close" id="chatClose">&times;</button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="chat-msg assistant">
            Xin chào! Tôi là trợ lý AI của Folio Bookstore. Tôi có thể giúp bạn tìm sách phù hợp, tư vấn thể loại, hoặc trả lời bất kỳ câu hỏi nào về sách. Bạn cần tôi giúp gì?
        </div>
    </div>
    <div class="chat-typing" id="chatTyping">
        <span></span><span></span><span></span>
    </div>
    <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Ask about books…" rows="1"></textarea>
        <button class="chat-send" id="chatSend">&#10148;</button>
    </div>
</div>

<script>
(function() {
    var toggle  = document.getElementById('chatToggle');
    var popup   = document.getElementById('chatPopup');
    var closeBtn= document.getElementById('chatClose');
    var input   = document.getElementById('chatInput');
    var sendBtn = document.getElementById('chatSend');
    var msgs    = document.getElementById('chatMessages');
    var typing  = document.getElementById('chatTyping');

    var customerId = '{{ customer_id|default:"" }}';
    var storageKey = 'folio_chat_sid_' + customerId;
    var sessionId  = localStorage.getItem(storageKey);
    var histLoaded = false;
    var sending    = false;

    toggle.addEventListener('click', function() {
        popup.classList.toggle('open');
        if (popup.classList.contains('open')) {
            input.focus();
            if (!sessionId && customerId) createSession();
            else if (sessionId && !histLoaded) loadHistory();
        }
    });
    closeBtn.addEventListener('click', function() { popup.classList.remove('open'); });
    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    });

    function createSession() {
        fetch('/chat/api/', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'create_session', customer_id:parseInt(customerId)})
        }).then(function(r){return r.json();}).then(function(d){
            if (d.id) { sessionId = d.id; localStorage.setItem(storageKey, sessionId); }
        }).catch(function(){
            addMsg('system', 'Could not connect to advisor service.');
        });
    }

    function loadHistory() {
        fetch('/chat/api/', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'get_history', session_id:sessionId})
        }).then(function(r){return r.json();}).then(function(d){
            if (d.messages && d.messages.length > 0) {
                msgs.innerHTML = '';
                addMsg('assistant', 'Xin chào! Tôi là trợ lý AI của Folio Bookstore. Tôi có thể giúp bạn tìm sách phù hợp, tư vấn thể loại, hoặc trả lời bất kỳ câu hỏi nào về sách. Bạn cần tôi giúp gì?');
                d.messages.forEach(function(m){ addMsg(m.role, m.content); });
                scrollBot();
            }
            histLoaded = true;
        }).catch(function(){ histLoaded = true; });
    }

    function send() {
        var text = input.value.trim();
        if (!text || sending) return;
        if (!sessionId) {
            if (customerId) { createSession(); addMsg('system', 'Creating session, please try again.'); }
            else { addMsg('system', 'Please log in to use the chat advisor.'); }
            return;
        }
        addMsg('user', text);
        input.value = ''; input.style.height = 'auto';
        sending = true; sendBtn.disabled = true;
        typing.classList.add('active'); scrollBot();

        fetch('/chat/api/', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'send_message', session_id:sessionId, message:text})
        }).then(function(r){return r.json();}).then(function(d){
            typing.classList.remove('active');
            if (d.assistant_message) addMsg('assistant', d.assistant_message.content);
            else if (d.error) addMsg('system', d.error);
        }).catch(function(){
            typing.classList.remove('active');
            addMsg('system', 'Connection error. Please try again.');
        }).finally(function(){
            sending = false; sendBtn.disabled = false; input.focus();
        });
    }

    function renderMd(text) {
        return text
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/^### (.+)$/gm,'<strong style="display:block;margin:6px 0 2px;">$1</strong>')
            .replace(/^## (.+)$/gm,'<strong style="display:block;margin:8px 0 2px;font-size:1.05em;">$1</strong>')
            .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
            .replace(/\*(.+?)\*/g,'<em>$1</em>')
            .replace(/^[\-\*] (.+)$/gm,'<span style="display:block;padding-left:10px;">• $1</span>')
            .replace(/^\d+\. (.+)$/gm,'<span style="display:block;padding-left:10px;">$1</span>')
            .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
    }

    function addMsg(role, text) {
        var div = document.createElement('div');
        div.className = 'chat-msg ' + role;
        if (role === 'assistant') div.innerHTML = renderMd(text);
        else div.textContent = text;
        msgs.appendChild(div);
        scrollBot();
    }

    function scrollBot() { msgs.scrollTop = msgs.scrollHeight; }
})();
</script>
{% endif %}
