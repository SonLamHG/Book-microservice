{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 160px); display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 20px;">
    <div>
        <div style="font-family:'Cormorant Garamond',serif; font-size:96px; font-weight:600; color:var(--err); line-height:1; margin-bottom:16px; opacity:.7;">403</div>
        <h1 style="font-size:28px; margin-bottom:10px;">Access Denied</h1>
        <p style="color:var(--tx-m); font-size:15px; max-width:360px; margin:0 auto 28px;">You don't have permission to view this page. Please contact an administrator if you believe this is an error.</p>
        <a href="/" class="btn btn-primary">Return to Home</a>
    </div>
</div>
{% endblock %}
