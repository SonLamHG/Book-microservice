{% extends 'base.html' %}
{% block title %}{% if edit %}Edit Staff{% else %}Add Staff{% endif %}{% endblock %}
{% block content %}
<div style="padding:32px 0 24px; border-bottom:1px solid var(--border); margin-bottom:28px; display:flex; justify-content:space-between; align-items:center;">
    <h1 style="margin:0;">{% if edit %}Edit Staff Member{% else %}Add Staff Member{% endif %}</h1>
    <a href="/staff/" class="btn">← Back</a>
</div>
<div style="max-width:480px;">
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required value="{% if item %}{{ item.name }}{% endif %}" placeholder="Staff name…">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required value="{% if item %}{{ item.email }}{% endif %}" placeholder="email@example.com">
            </div>
            <div class="form-group" style="margin-bottom:24px;">
                <label>Role</label>
                <input type="text" name="role" value="{% if item %}{{ item.role }}{% endif %}" placeholder="e.g. STAFF">
            </div>
            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">
                    {% if edit %}Update{% else %}Add Staff{% endif %}
                </button>
                <a href="/staff/" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
